# Dedicated crm-estetica Supabase. Push declares only foundation Auth settings.
project_id = "crm-estetica"
[db]
major_version = 17
[db.migrations]
enabled = true
[db.seed]
enabled = false
[auth]
enabled = true
site_url = "https://crm-estetica-test.vercel.app"
additional_redirect_urls = ["http://127.0.0.1:3220", "http://localhost:3220", "http://127.0.0.1:3220/auth/callback", "http://localhost:3220/auth/callback", "http://127.0.0.1:3220/auth/reset", "http://localhost:3220/auth/reset", "https://crm-estetica-test.vercel.app", "https://crm-estetica-test.vercel.app/auth/callback", "https://crm-estetica-test.vercel.app/auth/reset"]
minimum_password_length = 12
enable_signup = false
enable_anonymous_sign_ins = false
enable_refresh_token_rotation = true
[auth.email]
# Keep password login available; the global auth.enable_signup closes registration.
enable_signup = true
enable_confirmations = true
double_confirm_changes = true
secure_password_change = true
max_frequency = "60s"
otp_length = 8
